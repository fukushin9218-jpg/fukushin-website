
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>福岡進学塾｜那珂川校・春日校</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: #17365d;
      background: #ffffff;
    }
    header {
      background: white;
      border-bottom: 3px solid #b8e4f8;
      padding: 8px 5%;
      display: flex;
align-items: center;
justify-content: space-between;
    }
    .brand {
  max-width: 280px;
  margin: 0;
}
    .brand-small {
      font-size: 13px;
      color: #54738f;
      letter-spacing: 1px;
    }
    .brand-name {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      color: #124b91;
      margin: 5px 0;
    }
    
.instagram-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 6px 18px;
  border-radius: 18px;
  border: 2px solid #ffb3d1;
  background: linear-gradient(120deg, #fff5fa, #f0f8ff);
  color: #ef3280;
  font-size: 18px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 4px 15px rgba(35, 120, 200, 0.12);
  transition: transform 0.3s, box-shadow 0.3s;
}


.instagram-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(35, 120, 200, 0.25);
}
    nav {
      background: #124b91;
      padding: 15px 5%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .hero {
      background: linear-gradient(135deg, #dff5ff, #ffffff 60%, #b9e6fb);
      text-align: center;
      padding: 0px 20px;
    }
    .hero h1 {
      color: #124b91;
      font-size: clamp(26px, 5vw, 44px);
      margin: 0 0 20px;
    }
    .hero p {
      font-size: 17px;
      line-height: 1.9;
    }
    .section {
      max-width: 1150px;
      margin: auto;
      padding: 65px 20px;
      text-align: center;
    }
    .section h2 {
      color: #124b91;
      font-size: 29px;
      margin-bottom: 8px;
    }
    .english {
      color: #68b8e7;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: bold;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 35px;
    }
    .course {
      background: #f1f9ff;
      border: 1px solid #d0e9fa;
      border-radius: 14px;
      padding: 35px 12px;
      font-size: 19px;
      font-weight: bold;
    }
    .split-course {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }
    .split-course div {
      background: #f1f9ff;
      border: 1px solid #d0e9fa;
      border-radius: 12px;
      padding: 14px;
      font-weight: bold;
    }
    .school {
      background: #f0f8fd;
    }
    footer {
      background: #124b91;
      color: white;
      text-align: center;
      padding: 30px 15px;
      font-size: 13px;
    }
    
.insta-title {
  color: #ef3280;
  font-size: 18px;
  font-weight: 800;
  text-align: center;
}

.insta-bottom {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.insta-icon {
  font-size: 46px;
  line-height: 1;
}

.insta-tap {
  color: #174f91;
  font-size: 16px;
  font-weight: bold;
}

    @media (max-width: 700px) {
      .course-grid { grid-template-columns: repeat(2, 1fr); }
      .course { font-size: 15px; padding: 25px 8px; }
      nav { gap: 12px; }
      nav a { font-size: 12px; }
      .hero { padding: 65px 20px; }
      header {
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}
.instagram-link {
  align-self: flex-end;
  font-size: 13px;
  padding: 9px 14px;
}
    }
 .slide-dots {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 15px auto 25px;
}

.slide-dots span {
  width: 12px;
  height: 12px;
  background: #cbd5e1;
  border-radius: 50%;
  display: block;
}

.slide-dots span:first-child {
  background: #ff4f91;
  width: 12px;
  border-radius: 10px;
}
    .slide-dots span {
  position: relative;
  transform: none;
}
  </style>
</head>
<body>


<header>
  <div class="brand">
    <img src="新ホームページ用.png" alt="福岡進学塾｜SINCE 1975 福岡総合教育学院" style="display:block; width:100%; height:auto;">
  </div>
  
<a class="instagram-link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
  <span class="insta-title">塾内の様子をInstagramでチェック♪</span>
  <span class="insta-bottom">
    
<span class="insta-icon">
  <svg width="48" height="48" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="Instagram">
    <defs>
      <linearGradient id="instaGradient" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffcb42"/>
        <stop offset="45%" stop-color="#fa315f"/>
        <stop offset="100%" stop-color="#8646c8"/>
      </linearGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#instaGradient)"/>
    <rect x="15" y="15" width="34" height="34" rx="10" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="32" cy="32" r="9" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="44" cy="20" r="3" fill="white"/>
  </svg>
</span>

    <span class="insta-tap">タップしてみてね！</span>
  </span>
</a>

</header>


<nav>
  <a href="#home">ホーム</a>
  <a href="#course">コース紹介</a>
  <a href="#news">新着情報</a>
  <a href="#school">校舎案内</a>
  <a href="#contact">お問い合わせ</a>
</nav>

<section class="hero" id="home">
  <img src="9月生募集_27cm×11cm_300dpi_3189x1299.jpg"
       alt="福岡進学塾 9月生募集・無料体験受付中"
       style="display:block; width:100%; max-width:1400px; height:auto; margin:auto;">
  <div class="slide-dots">
  <span></span>
<span></span>
<span></span>
</div>
</section>

<section class="section" id="course">
  <div class="english">COURSE</div>
  <h2>コース紹介</h2>
  <p>目的に合わせた学びをご案内します。</p>

  <div class="course-grid">
    <div class="course">集団クラス</div>
    <div class="course">個別指導</div>
    <div class="course">そろばん</div>
    <div class="course">キッズくらぶ</div>
    <div class="course">小学生英語<br>オンライン英語</div>
    <div class="split-course">
      <div>フクト</div>
      <div>英検</div>
    </div>
  </div>
</section>

<section class="section" id="news">
  <div class="english">NEWS</div>
  <h2>新着情報</h2>
  <p>現在、新しいホームページを制作中です。</p>
</section>

<div class="school">
  <section class="section" id="school">
    <div class="english">SCHOOL</div>
    <h2>校舎案内</h2>
    <p>那珂川校　｜　春日校</p>
  </section>
</div>

<section class="section" id="contact">
  <div class="english">CONTACT</div>
  <h2>お問い合わせ</h2>
  <p>お問い合わせ・体験授業のお申し込みは、各校舎のLINEからご案内します。</p>
</section>

<footer>
  SINCE 1975　福岡総合教育学院<br>
  © 福岡進学塾
</footer>

</body>
</html>
