
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>福岡進学塾｜那珂川校・春日校</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans JP", sans-serif;
      color: #17365d;
      background: #ffffff;
    }
    header {
      background: white;
      border-bottom: 3px solid #b8e4f8;
      padding: 8px 5%;
    }
    .brand {
      max-width: 600px;
      margin: auto;
    }
    .brand-small {
      font-size: 13px;
      color: #54738f;
      letter-spacing: 1px;
    }
    .brand-name {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      color: #124b91;
      margin: 5px 0;
    }
    nav {
      background: #124b91;
      padding: 15px 5%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 22px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .hero {
      background: linear-gradient(135deg, #dff5ff, #ffffff 60%, #b9e6fb);
      text-align: center;
      padding: 95px 20px;
    }
    .hero h1 {
      color: #124b91;
      font-size: clamp(26px, 5vw, 44px);
      margin: 0 0 20px;
    }
    .hero p {
      font-size: 17px;
      line-height: 1.9;
    }
    .section {
      max-width: 1150px;
      margin: auto;
      padding: 65px 20px;
      text-align: center;
    }
    .section h2 {
      color: #124b91;
      font-size: 29px;
      margin-bottom: 8px;
    }
    .english {
      color: #68b8e7;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: bold;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 35px;
    }
    .course {
      background: #f1f9ff;
      border: 1px solid #d0e9fa;
      border-radius: 14px;
      padding: 35px 12px;
      font-size: 19px;
      font-weight: bold;
    }
    .split-course {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
    }
    .split-course div {
      background: #f1f9ff;
      border: 1px solid #d0e9fa;
      border-radius: 12px;
      padding: 14px;
      font-weight: bold;
    }
    .school {
      background: #f0f8fd;
    }
    footer {
      background: #124b91;
      color: white;
      text-align: center;
      padding: 30px 15px;
      font-size: 13px;
    }
    @media (max-width: 700px) {
      .course-grid { grid-template-columns: repeat(2, 1fr); }
      .course { font-size: 15px; padding: 25px 8px; }
      nav { gap: 12px; }
      nav a { font-size: 12px; }
      .hero { padding: 65px 20px; }
    }
  </style>
</head>
<body>


<header>
  <div class="brand">
    <img src="新ホームページ用.png" alt="福岡進学塾｜SINCE 1975 福岡総合教育学院" style="display:block; width:100%; height:auto;">
  </div>
</header>


<nav>
  <a href="#home">ホーム</a>
  <a href="#course">コース紹介</a>
  <a href="#news">新着情報</a>
  <a href="#school">校舎案内</a>
  <a href="#contact">お問い合わせ</a>
</nav>

<section class="hero" id="home">
  <h1>学ぶ楽しさを、未来の力に。</h1>
  <p>一人ひとりの成長を大切に。<br>
  福岡進学塾 那珂川校・春日校</p>
</section>

<section class="section" id="course">
  <div class="english">COURSE</div>
  <h2>コース紹介</h2>
  <p>目的に合わせた学びをご案内します。</p>

  <div class="course-grid">
    <div class="course">集団クラス</div>
    <div class="course">個別指導</div>
    <div class="course">そろばん</div>
    <div class="course">キッズくらぶ</div>
    <div class="course">小学生英語<br>オンライン英語</div>
    <div class="split-course">
      <div>フクト</div>
      <div>英検</div>
    </div>
  </div>
</section>

<section class="section" id="news">
  <div class="english">NEWS</div>
  <h2>新着情報</h2>
  <p>現在、新しいホームページを制作中です。</p>
</section>

<div class="school">
  <section class="section" id="school">
    <div class="english">SCHOOL</div>
    <h2>校舎案内</h2>
    <p>那珂川校　｜　春日校</p>
  </section>
</div>

<section class="section" id="contact">
  <div class="english">CONTACT</div>
  <h2>お問い合わせ</h2>
  <p>お問い合わせ・体験授業のお申し込みは、各校舎のLINEからご案内します。</p>
</section>

<footer>
  SINCE 1975　福岡総合教育学院<br>
  © 福岡進学塾
</footer>

</body>
</html>
