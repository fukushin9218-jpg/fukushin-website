
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塾生専用 | 福岡進学塾</title>
  <script src="menu.js" defer></script>
  <style>
    body {
      margin: 0;
      font-family: "Arial", "Meiryo", sans-serif;
      background: #eef7ff;
      color: #124b91;
    }
    .login-box {
      max-width: 430px;
      margin: 70px auto;
      padding: 40px 30px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(0, 50, 110, 0.1);
      text-align: center;
    }
    h1 { font-size: 28px; }
    p { line-height: 1.8; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #bdd5ec;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #14549a;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2875bd; }
    #message { color: #d63355; }
  </style>
</head>
<body>

  <div id="common-header"></div>

  <main class="login-box">
    <h1>塾生専用ページ</h1>
    <p>福岡進学塾の塾生専用ページです。<br>
    ユーザー名とパスワードを入力してください。</p>

    <input id="username" type="text"
           placeholder="ユーザー名" autocomplete="username">

    <input id="password" type="password"
           placeholder="パスワード" autocomplete="current-password">

    <button type="button" onclick="login()">ログイン</button>

    <p id="message"></p>
  </main>

  <script>
    
  // 塾生共通のログイン設定（後から変更できます）
  const LOGIN_USER = "student";
  const LOGIN_PASS = "fukushin2026";

  function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (username === LOGIN_USER && password === LOGIN_PASS) {
     document.querySelector(".login-box").innerHTML = `
  <h1>高校入試・進路情報</h1>
  <p>福岡進学塾 塾生専用ページへようこそ！</p>

  <h2>📅 令和9年度 入試日程</h2>
  <p>私立専願：1月26日</p>
  <p>私立前期：2月12日</p>
  <p>私立後期：2月20日</p>
  <p>公立推薦・特色化選抜：2月2日・3日</p>
  <p>公立一般：3月9日</p>
  <p>公立補充：3月25日</p>
  <p>高専一般：2月14日</p>

  <h2>🏫 高校検索・学校情報</h2>
  <p>公立高校・私立高校・高専の情報を掲載します。</p>

  <h2>📊 フクト偏差値一覧</h2>
  <p>資料画像を掲載予定です。</p>

  <h2>📈 公立入試の平均点推移</h2>
  <p>過去の平均点データを掲載予定です。</p>

  <h2>📋 特色化選抜の基準</h2>
  <p>各高校の募集条件や基準を掲載予定です。</p>

  <h2>📖 福岡県の高校入試の仕組み</h2>
  <p>私立・公立入試の制度をわかりやすく解説します。</p>
`;
    } else {
      message.textContent = "ユーザー名またはパスワードが違います。";
    }
  }
</script>

</body>
</html>
