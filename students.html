  // 学校名だけを色付き・太字にする
function colorSchoolNames(text, color) {
  if (!text) return "";

  return text.split("／").map(item => {
    const match = item.trim().match(/^(.+?)(\s*[（(].*)$/);
    if (!match) return item;

    const schoolName = match[1];
    const course = match[2];

    const isKosen = /久留米高専|北九州高専|有明高専/.test(schoolName);
    const nameColor = isKosen ? "#E67E22" : color;

    return `<strong style="color:${nameColor};">${schoolName}</strong>${course}`;
  }).join("<br>");
}
  for (let score = 70; score >= 37; score--) {

<td style="padding:12px; border:1px solid #ddd; text-align:center; font-weight:bold;">${score}</td>
<td style="padding:12px; border:1px solid #ddd; text-align:left;">${colorSchoolNames(fscoreData[score]?.private || "", "#164A8A")}</td>
      </tr>
    `;
  }

  html += `
        </tbody>
      </table>
    </div>
  `;

  area.innerHTML = html;
}

    function showExamAverageChart(subject = "total") {
  const area = document.getElementById("examAverageChart");
  if (!area) return;
// 選択中の科目ボタンだけ色を変える
const subjects = ["total", "japanese", "math", "social", "science", "english"];

document.querySelectorAll(".average-buttons button").forEach((button, index) => {
  button.classList.toggle("active", subjects[index] === subject);
});
  const width = 900;
  const height = 300;
  const left = 55;
  const right = 20;
  const top = 35;
  const bottom = 55;

  const minScore = subject === "total" ? 140 : 20;
const maxScore = subject === "total" ? 190 : 50;

  const x = i => left + i * (width - left - right) / (examAverageData.length - 1);
  const y = score => top + (maxScore - score) * (height - top - bottom) / (maxScore - minScore);

  const points = examAverageData
    .map((d, i) => `${x(i)},${y(d[subject])}`)
    .join(" ");

  let svg = `<svg viewBox="0 0 ${width} ${height}"
    style="width:100%;height:auto;display:block;"
    role="img" aria-label="公立高校入試の5教科合計平均点の推移">`;

  for (let score = minScore; score <= maxScore; score += 10) {
    svg += `
      <line x1="${left}" y1="${y(score)}" x2="${width-right}" y2="${y(score)}"
        stroke="#DCE6F2" stroke-width="1"/>
      <text x="${left-12}" y="${y(score)+5}" text-anchor="end"
        fill="#52657A" font-size="14">${score}</text>
    `;
  }

  svg += `<polyline points="${points}" fill="none"
    stroke="#1976D2" stroke-width="3" stroke-linejoin="round"/>`;

  examAverageData.forEach((d, i) => {
    svg += `
      <circle cx="${x(i)}" cy="${y(d[subject])}" r="5" fill="#1976D2"/>
<text x="${x(i)}" y="${y(d[subject])-11}" text-anchor="middle"
  font-size="12" fill="#164A8A">${d[subject]}</text>
      <text x="${x(i)}" y="${height-20}" text-anchor="middle"
        font-size="12" fill="#52657A">${d.year}</text>
    `;
  });

  svg += "</svg>";

  area.innerHTML = `
    <div style="background:#F3F8FF;padding:18px;border-radius:12px;margin:20px 0;">
      <h3 style="text-align:center;color:#164A8A;">${subject === "total" ? "5教科合計" : {
  japanese: "国語",
  math: "数学",
  social: "社会",
  science: "理科",
  english: "英語"
}[subject]}の平均点推移</h3>
      ${svg}
    </div>
  `;
}

    let selectedSchoolType = "すべて";

function filterSchools(type) {
  selectedSchoolType = type;
  searchSchools();

  document.querySelectorAll('.school-search button').forEach(button => {
    const isSelected = button.textContent.trim() === type;

    button.style.backgroundColor = isSelected ? '#19569B' : '#EAF3FF';
    button.style.color = isSelected ? '#FFFFFF' : '#19569B';
    button.style.border = isSelected ? '2px solid #19569B' : '2px solid #C5DDF5';
  });
}
function searchSchools() {
  const input = document.getElementById("schoolKeyword");
  const results = document.getElementById("schoolResults");

  if (!input || !results) return;

  const keyword = input.value.trim();
 const filtered = schools.filter(school =>
  school.name.includes(keyword) &&
  (selectedSchoolType === "すべて" || school.type === selectedSchoolType)
);

  if (filtered.length === 0) {
    results.innerHTML = "<p>該当する学校がありません。</p>";
    return;
  }

  results.innerHTML = filtered.map(school => `
    <div style="padding:15px; border-bottom:1px solid #ddd; text-align:left;">
      <a href="${school.url}" target="_blank" rel="noopener noreferrer">
        ${school.name}
      </a>
      <span>（${school.type}・${school.score}）</span>
      <p style="margin:8px 0 0; color:#555; font-size:14px;">📚 学科・コース：${school.course}</p>
    </div>
  `).join("");
}
