
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塾生専用 | 福岡進学塾</title>
  <script src="menu.js" defer></script>
  <style>
    body {
      margin: 0;
      font-family: "Arial", "Meiryo", sans-serif;
      background: #eef7ff;
      color: #124b91;
    }
    .login-box {
      max-width: 1100px;
      margin: 70px auto;
      padding: 40px 30px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 28px rgba(0, 50, 110, 0.1);
      text-align: center;
    }
    .login-box:not(.logged-in) {
  max-width: 430px;
}
    h1 { font-size: 28px; }
    p { line-height: 1.8; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #bdd5ec;
      border-radius: 10px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #14549a;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #2875bd; }
    #message { color: #d63355; }
    /* 入試日程のカード */
.exam-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin: 30px 0 45px;
  text-align: left;
}

.exam-card {
  background: #eef6ff;
  border: 1px solid #d4e7fa;
  border-radius: 16px;
  padding: 24px 18px;
}

.exam-card:nth-child(2) {
  background: #edf9f2;
  border-color: #d1eadb;
}

.exam-card:nth-child(3) {
  background: #fff5e9;
  border-color: #f4dfc5;
}

.exam-card h3 {
  margin-top: 0;
  text-align: center;
  font-size: 21px;
}

.exam-card p {
  font-size: 16px;
  line-height: 1.7;
  margin: 12px 0;
}

/* スマートフォン用 */
@media (max-width: 800px) {
  .exam-grid {
    grid-template-columns: 1fr;
  }

  .login-box {
    margin: 25px 12px;
    padding: 25px 16px;
  }
}
  </style>
</head>
<body>

  <div id="common-header"></div>

  <main class="login-box">
    <h1>塾生専用ページ</h1>
    <p>福岡進学塾の塾生専用ページです。<br>
    ユーザー名とパスワードを入力してください。</p>

    <input id="username" type="text"
           placeholder="ユーザー名" autocomplete="username">

    <input id="password" type="password"
           placeholder="パスワード" autocomplete="current-password">

    <button type="button" onclick="login()">ログイン</button>

    <p id="message"></p>
  </main>

  <script>
    
  // 塾生共通のログイン設定（後から変更できます）
  const LOGIN_USER = "student";
  const LOGIN_PASS = "fukushin2026";

  function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if (username === LOGIN_USER && password === LOGIN_PASS) {
      document.querySelector(".login-box").classList.add("logged-in");
     document.querySelector(".login-box").innerHTML = `
  <h1>高校入試・進路情報</h1>
  <p>福岡進学塾 塾生専用ページへようこそ！</p>

  <h2>📅 令和9年度 入試日程</h2>

<div class="exam-grid">
  <div class="exam-card">
    <h3>🏫 私立高校</h3>
    <p>専願入試：1月26日</p>
    <p>前期入試：2月12日</p>
    <p>後期入試：2月20日</p>
  </div>

  <div class="exam-card">
    <h3>📘 公立高校</h3>
    <p>推薦・特色化選抜：2月2日・3日</p>
    <p>一般入試：3月9日</p>
    <p>補充募集：3月25日</p>
  </div>

  <div class="exam-card">
    <h3>🎓 高専</h3>
    <p>一般入試：2月14日</p>
  </div>
</div>

  <h2>🏫 高校検索・学校情報</h2>
<p>学校名を入力すると、該当する高校を探せます。</p>

<div class="school-search">
  <input
    type="search"
    id="schoolKeyword"
    placeholder="🔍 学校名を入力（例：春日・筑紫）"
    oninput="searchSchools()"
  >
  <div id="schoolResults">
    <p>ここに学校一覧が表示されます。</p>
  </div>
</div>

  <h2>📊 フクト偏差値一覧</h2>
  <p>資料画像を掲載予定です。</p>

  <h2>📈 公立入試の平均点推移</h2>
  <p>過去の平均点データを掲載予定です。</p>

  <h2>📋 特色化選抜の基準</h2>
  <p>各高校の募集条件や基準を掲載予定です。</p>

  <h2>📖 福岡県の高校入試の仕組み</h2>
  <p>私立・公立入試の制度をわかりやすく解説します。</p>
`;
    } else {
      message.textContent = "ユーザー名またはパスワードが違います。";
    }
  }
    // 学校情報（まずは動作確認用の3校）
const schools = [
  {
    name: "筑紫丘",
    type: "公立",
    score: "F68・70",
    url: "https://chikushigaoka.fku.ed.jp/"
  },
  {
    name: "春日",
    type: "公立",
    score: "F63",
    url: "https://kasuga.fku.ed.jp/"
  },
  {
    name: "筑紫中央",
    type: "公立",
    score: "F60",
    url: "https://chikushichuo.fku.ed.jp/"
  }
];

// 学校名で検索する機能
function searchSchools() {
  const input = document.getElementById("schoolKeyword");
  const results = document.getElementById("schoolResults");

  if (!input || !results) return;

  const keyword = input.value.trim();
  const filtered = schools.filter(school =>
    school.name.includes(keyword)
  );

  if (filtered.length === 0) {
    results.innerHTML = "<p>該当する学校がありません。</p>";
    return;
  }

  results.innerHTML = filtered.map(school => `
    <div style="padding:15px; border-bottom:1px solid #ddd; text-align:left;">
      <a href="${school.url}" target="_blank" rel="noopener noreferrer">
        ${school.name}
      </a>
      <span>（${school.type}・${school.score}）</span>
    </div>
  `).join("");
}
</script>

</body>
</html>
