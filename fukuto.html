<!DOCTYPE html>
<html lang="ja">
<head>

<title>フクト模擬試験｜福岡進学塾</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  color: #17365d;
  background: #f1f7ff;
}
main {
  max-width: 1150px;
  margin: 0 auto;
  padding: 65px 20px 90px;
}
.page-title {
  text-align: center;
  margin-bottom: 45px;
}
.page-title h1 {
  color: #124b91;
  font-size: 40px;
  margin: 0 0 22px;
}
.page-title p { font-size: 19px; }
.content {
  background: white;
  border-radius: 22px;
  padding: 55px 50px;
}
.content h2 {
  color: #1767b2;
  font-size: 27px;
  border-bottom: 2px solid #c9e4ff;
  padding-bottom: 17px;
}
.content p {
  font-size: 18px;
  line-height: 2;
}
.info {
  background: #eef7ff;
  padding: 25px;
  border-radius: 17px;
  margin-top: 30px;
}
.info-row {
  display: flex;
  gap: 15px;
  padding: 13px 0;
  border-bottom: 1px solid #d4e7f8;
  font-size: 17px;
}
.info-row:last-child { border-bottom: none; }
.info-row strong {
  width: 125px;
  flex-shrink: 0;
  color: #124b91;
}
.notice {
  background: #fff8e9;
  border-radius: 15px;
  padding: 20px 25px;
  margin-top: 30px;
}
.notice h3 { color: #1767b2; }
.back {
  display: inline-block;
  margin-top: 35px;
  padding: 13px 28px;
  border-radius: 30px;
  background: #1767b2;
  color: white;
  text-decoration: none;
  font-weight: bold;
}
@media(max-width:600px) {
  .page-title h1 { font-size: 28px; }
  .content { padding: 24px; }
  .info-row { display: block; }
  .info-row strong { display: block; margin-bottom: 5px; }
}
</style>
<script src="menu.js" defer></script>
</head>
<body>
<div id="common-header"></div>

<main>
  <div class="page-title">
    <h1>フクト模擬試験</h1>

  </div>

    <div class="info">
      <div class="info-row">
        <strong>試験日</strong>
        <span>2026年10月25日（日）</span>
      </div>
      <div class="info-row">
        <strong>対象学年</strong>
        <span>確認中</span>
      </div>
      <div class="info-row">

      </div>
      <div class="info-row">

      </div>

    <div class="notice">
      <h3>外部生の方も受験できます！</h3>
      <p>受験をご希望の方は、福岡進学塾までお電話にてお問い合わせください。</p>
      <p>※現在、掲載内容を準備中です。詳細は確定次第お知らせいたします。</p>
