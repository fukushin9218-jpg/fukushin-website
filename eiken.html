<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>英検のご案内｜福岡進学塾</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans JP", sans-serif; color: #123b70; background: #f1f7ff; }
main { max-width: 1150px; margin: 0 auto; padding: 65px 20px 90px; }
.page-title { text-align: center; margin-bottom: 45px; }
.page-title h1 { font-size: 38px; color: #174e91; margin: 0 0 18px; }
.page-title p { font-size: 18px; }
.content { background: white; border-radius: 22px; padding: 52px; }
h2 { color: #d83c4b; font-size: 27px; border-bottom: 2px solid #ffd7dc; padding-bottom: 17px; }
.content p { font-size: 17px; line-height: 2; }
.info { background: #fff2f3; padding: 16px 25px; border-radius: 14px; margin: 25px 0; }
.info-row { display: grid; grid-template-columns: 150px 1fr; gap: 15px; padding: 16px 0; border-bottom: 1px solid #f2cbd0; font-size: 17px; }
.info-row:last-child { border-bottom: none; }
.info-row strong { color: #a72a3a; }
.notice { background: #fff8eb; border-radius: 14px; padding: 24px; margin: 25px 0; }
.notice h3 { color: #c34b32; margin-top: 0; }
.back { display: inline-block; margin-top: 30px; padding: 13px 28px; border-radius: 30px; background: #1767b2; color: white; text-decoration: none; font-weight: bold; }
@media (max-width: 600px) {
  main { padding: 35px 15px; }
  .page-title h1 { font-size: 28px; }
  .content { padding: 24px; }
  .info-row { grid-template-columns: 110px 1fr; font-size: 15px; }
}
</style>
<script src="menu.js" defer></script>
</head>
<body>
<div id="common-header"></div>
<main>
  <div class="page-title">
    <h1>英検のご案内</h1>
    <p>英語力を確かめ、次の目標へチャレンジ！</p>
  </div>
  <div class="content">
    <h2>次回の英検 実施案内</h2>
    <p>福岡進学塾では、英検を実施しています。</p>
    <p>塾生だけでなく、外部生の方もお申し込みいただけます。</p>
    <div class="info">
      <div class="info-row"><strong>実施回</strong><span>確認中</span></div>
      <div class="info-row"><strong>一次試験日</strong><span>確認中</span></div>
      <div class="info-row"><strong>二次試験日</strong><span>確認中</span></div>
      <div class="info-row"><strong>申込締切</strong><span>確認中</span></div>
      <div class="info-row"><strong>対象級</strong><span>確認中</span></div>
      <div class="info-row"><strong>試験時間</strong><span>確認中</span></div>
      <div class="info-row"><strong>試験会場</strong><span>確認中</span></div>
      <div class="info-row"><strong>検定料</strong><span>確認中</span></div>
      <div class="info-row"><strong>申込方法</strong><span>お電話にてお問い合わせください</span></div>
    </div>
    <div class="notice">
      <h3>外部生の方も受験できます！</h3>
      <p>受験をご希望の方は、福岡進学塾までお電話でお問い合わせください。</p>
      <p>※現在、次回の試験情報を準備中です。日程などが確定次第、こちらでお知らせいたします。</p>
    </div>
    <a class="back" href="index.html#courses">← 学びのご案内に戻る</a>
  </div>
</main>
</body>
</html>
